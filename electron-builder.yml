appId: com.pomodoro.app
productName: Pomodoro
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: assets/icon.png
linux:
  icon: assets/icon.png
  target:
    - AppImage
